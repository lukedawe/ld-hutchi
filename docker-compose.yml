# A Docker Compose file for production.
services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password.txt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data 
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - backend
    secrets:
      - pg_password
      - pg_env
    
  website:
    image: nginx-frontend
    build:
      context:
        ./website
      args:
      - REACT_APP_SERVICES_HOST=/services/m
    ports:
      - 80:80
    depends_on:
      - api
    networks:
      - backend
      - frontend

  api:
    image: gin-backend
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./api
    networks:
      - backend
    expose:
      - 8080
    secrets:
      - api_env
    environment:
      - ENV_LOCATION=/run/secrets/.env
    restart: always

  adminer:
    image: adminer
    restart: always
    ports:
      - 8082:8080
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
  frontend:

secrets:
  api_env:
    file: api/.env
  pg_password:
    file: pg_password.txt
  pg_env:
    file: pg.env